[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myapp"
version = "0.1.0"
description = "Workshop starter project for ai-engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Arcasiles Group" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
myapp = "myapp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
